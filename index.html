<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> LeanLog Workout Tracker</title>
  <script src="js/backend-config.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" crossorigin href="./assets/index-CFrdSFCH.css">
</head>
<body>
  
  <div class="header" style="display: inline-flex; align-items: center; margin-left: 20px;">
    <h1 style="margin-right: 20px;  flex-grow: 1;">LeanLog Workout Tracker</h1> <!-- Adding right margin to create space between the heading and the button -->
    <div id="authStatus" class="auth-status" aria-live="polite">
      <span id="authMessage">Checking login...</span>
      <a id="authLink" href="https://lean-backend.agreeableplant-a51f439e.northeurope.azurecontainerapps.io/login">Log in</a>
      <a id="demoLink" href="https://lean-backend.agreeableplant-a51f439e.northeurope.azurecontainerapps.io/demo">Try demo mode</a>
    </div>
  </div>

  <div id="settingsMenu" class="settings-menu">
    <button type="button" id="settingsGearBtn" class="settings-gear-btn" aria-label="Open settings" aria-expanded="false" aria-controls="settingsPanel">⚙</button>
    <div id="settingsPanel" class="settings-panel hidden" role="menu" aria-label="Site settings">
      <div class="settings-section-block">
        <div class="settings-section-title">Workout Builder</div>
        <label class="settings-checkbox-row" for="showWeightMovedSetting">
          <input type="checkbox" id="showWeightMovedSetting" checked>
          <span>Show weight moved</span>
        </label>
        <label class="settings-checkbox-row" for="showWorkoutNotesSetting">
          <input type="checkbox" id="showWorkoutNotesSetting" checked>
          <span>Show workout notes</span>
        </label>
        <label class="settings-checkbox-row" for="showSetNotesSetting">
          <input type="checkbox" id="showSetNotesSetting" checked>
          <span>Show set notes</span>
        </label>
        <label class="settings-checkbox-row" for="showPostWorkoutNotesSetting">
          <input type="checkbox" id="showPostWorkoutNotesSetting" checked>
          <span>Show post-workout notes</span>
        </label>
      </div>

      <div class="settings-section-block">
        <div class="settings-section-title">Add and Edit</div>
        <label class="settings-checkbox-row" for="includeAddEditSetting">
          <input type="checkbox" id="includeAddEditSetting" data-section-setting="addEdit" checked>
          <span>Include section</span>
        </label>
      </div>

      <div class="settings-section-block">
        <div class="settings-section-title">Show Workouts</div>
        <label class="settings-checkbox-row" for="includeWorkoutsSetting">
          <input type="checkbox" id="includeWorkoutsSetting" data-section-setting="workouts" checked>
          <span>Include section</span>
        </label>
      </div>

      <div class="settings-section-block">
        <div class="settings-section-title">Calendar</div>
        <label class="settings-checkbox-row" for="includeCalendarSetting">
          <input type="checkbox" id="includeCalendarSetting" data-section-setting="calendar" checked>
          <span>Include section</span>
        </label>
        <label class="settings-checkbox-row" for="showWholeYearSetting">
          <input type="checkbox" id="showWholeYearSetting">
          <span>Show full year</span>
        </label>
        <label class="settings-label" for="calendarStartWeekSetting" style="margin-top: 8px;">Start from week</label>
        <input type="number" id="calendarStartWeekSetting" class="form-control form-control-sm settings-select" min="1" max="53" step="1" value="1">
      </div>

      <div class="settings-section-block">
        <div class="settings-section-title">Progress</div>
        <label class="settings-checkbox-row" for="includeProgressSetting">
          <input type="checkbox" id="includeProgressSetting" data-section-setting="progress" checked>
          <span>Include section</span>
        </label>
        <button type="button" id="trackedExercisesToggleBtn" class="settings-link-btn" aria-expanded="false" aria-controls="trackedExercisesPanel">Select exercises to track</button>
        <div id="trackedExercisesPanel" class="tracked-exercises-panel hidden"></div>
      </div>

      <div class="settings-section-block">
        <div class="settings-section-title">Volume</div>
        <label class="settings-checkbox-row" for="includeVolumeSetting">
          <input type="checkbox" id="includeVolumeSetting" data-section-setting="volume" checked>
          <span>Include section</span>
        </label>
        <label class="settings-checkbox-row" for="showMatrixSetting">
          <input type="checkbox" id="showMatrixSetting">
          <span>Show matrix</span>
        </label>
      </div>
    </div>
  </div>

  <div class="col-sm-2" style="margin-left: 90px; display: none;">
    <button type="button" id="backupbtn" class="btn btn-primary" style="width: 120px;background-color: green; border-color: black;">backup</button>
    <div id="passwordPrompt" style="display: none;">
      <label for="password">Enter Password:</label>
      <input type="password" id="password" />
      <button type="button" id="submitPassword">Submit</button>
      <div id="error" style="color: red;"></div>
    </div>
  </div>
  
  <section id="workoutBuilderSection">
  <!-- Workout Management Section -->
  <div id="workoutManagement">
    <div style="margin-left: 20px;"><h2></h2></div>
   
    <form id="workoutForm"> 
      <div class="row p-3 builder-top-row"><div class="builder-left">
        <!-- Exercise Label -->
        <div class="col-3">
          <label for="exercisePickerTrigger"></label>
        </div>
      
        <!-- Exercise Select Dropdown -->
        <div class="col-sm-2">
          <div class="exercise-picker" id="exercisePicker">
            <button type="button" id="exercisePickerTrigger" class="form-control exercise-picker-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="exercisePickerMenu">
              <span data-exercise-picker-label>Select Exercise</span>
              <span aria-hidden="true">▾</span>
            </button>
            <select id="exerciseSelect" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
            <div id="exercisePickerMenu" class="exercise-picker-menu" role="region" aria-label="Exercise choices" hidden>
              <div class="btn-group exercise-grouping-toggle" role="group" aria-label="Exercise grouping mode">
                <button type="button" class="btn btn-sm btn-outline-secondary grouping-mode-btn active" data-grouping-mode="frequency" aria-pressed="true">Frequency</button>
                <button type="button" class="btn btn-sm btn-outline-secondary grouping-mode-btn" data-grouping-mode="category" aria-pressed="false">Grouping</button>
              </div>
              <div id="exercisePickerOptions" class="exercise-picker-options"></div>
            </div>
          </div>
        </div>
      
        <!-- Add Exercise Button -->
        <div class="col-sm-5">
          <button type="button" id="addExerciseBtn" class="btn btn-primary">Add</button>
        </div></div>
        

        <!-- Clock + converter -->
        <div class="builder-tools">
          <div class="clock-group">
            <div><button type="button" id="validateBtn" class="btn btn-primary" style="width: 120px;background-color: green; border-color: black;">Start clock</button></div>
            <div style="display: none"><button type="button" id="pauseBtn" class="btn btn-primary" title="Pause" aria-label="Pause"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="2.6" height="10"/><rect x="8.4" y="2" width="2.6" height="10"/></svg></button></div>
            <div style="display: none;"><button type="button" id="resetBtn" class="btn btn-primary" style="background-color: red; border: none;" title="Reset" aria-label="Reset"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button></div>
          </div>
          <div class="unit-converter" aria-label="Weight converter">
            <input type="number" id="convKg" class="form-control form-control-sm" placeholder="kg" step="any" min="0">
            <span aria-hidden="true">&harr;</span>
            <input type="number" id="convLbs" class="form-control form-control-sm" placeholder="lbs" step="any" min="0">
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="row" id="exerciseList">
    <!-- List of added exercises will appear here -->
  </div>
    
  <div class="row p-3" id="workoutSaveSection">
    <div class="col-sm-2">
      <button style="min-width: 150px;" id="saveWorkoutBtn">Save Workout</button>
    </div>
  
    <div class="col-sm-10">
      <div id="resultsection" class="hidden">
        <div class="row align-items-center"> <!-- This aligns input + button vertically centered -->
          <div class="col-auto">
            <input type="text" id="lastworkoutresult" class="form-control" placeholder="Add how you felt after your workout on [date]" 
            style="background-color: #fff8cc;">
          </div>
          <div class="col-auto">
            <button type="button" id="savelastworkoutbtn" class="btn" aria-label="Save how you felt">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  </section>
 <hr>

  <!-- Add Exercise Section -->
  <section id="addEditSection">
  <div class="row p-3" id="addExerciseSectiondiv">
    <!-- Add and Edit Section -->
    <div class="col-12">
        <div class="exo-toolbar">
          <button type="button" style="min-width: 150px;" id="toggleFormBtn">Add and Edit</button>
          <span id="addEditToolbarButtons" class="exo-toolbar-group hidden">
            <button type="button" id="showeditorbtn" class="exo-btn">Workout Editor</button>
            <button type="button" id="showexoeditorbtn" class="exo-btn">Exercise Editor</button>
            <button type="button" id="toggleAddExerciseFormBtn" class="exo-btn exo-btn-primary">Add Exercise</button>
          </span>
          <span class="exo-toolbar-spacer"></span>
          <span id="exerciseActionButtons" class="exo-toolbar-group hidden">
            <button type="button" id="saveExoBtn" class="exo-btn exo-btn-primary">Save Changes</button>
            <button type="button" id="deleteExoBtn" class="exo-btn exo-btn-danger">Delete Exercise</button>
          </span>
        </div>
        <section id="addExerciseSection" style="margin-top: 10px;">
          <div id="addExerciseFormWrapper" class="hidden exo-card" style="margin-top: 10px;">
            <div class="exo-add-header">
              <div>
                <h3>Add Exercise</h3>
                <p class="exo-hint">Create a new exercise and add it to your library.</p>
              </div>
            </div>
            <form id="addExerciseForm" class="exo-add-form">
                <div class="exo-add-field">
                  <label for="newExerciseName">Exercise Name</label>
                  <input type="text" id="newExerciseName" placeholder="Enter exercise name" required>
                </div>
                <div class="exo-add-field">
                  <label for="newExerciseNote">Add exercise note</label>
                  <input type="text" id="newExerciseNote" placeholder="Add exercise note?">
                </div>
                <div class="exo-add-field">
                  <label for="exerciseCategory">Choose Category</label>
                  <select id="exerciseCategory"></select>
                </div>

                <div class="row align-items-center" hidden>
                  <div class="col-auto">
                    <label>
                      <input type="checkbox" id="focusCheckbox" hidden> Focus Areas:
                    </label>
                  </div>
                  <!-- Preserve the focus container here -->
                  <div class="col" id="focusContainer" style="display: none;">
                    <select id="focusCategory" multiple class="form-control">
                      <option value="addNew">Add New</option>
                    </select>
                  </div>
                </div>

                <button type="button" id="saveNewExerciseBtn" class="exo-btn exo-btn-primary">Add Exercise</button>
                <button type="button" id="hideAddExerciseFormBtn" class="exo-btn">Hide form</button>
            </form>
          </div>
        </section> 
    </div>
    <!-- Editor Section (Appears Below) -->

        <div id="workouteditor" >
            <div id="editorsection" class="hidden">
                <div class="we-toolbar">
                  <select id="workoutYearNav" class="we-nav" aria-label="Year"></select>
                  <select id="workoutMonthNav" class="we-nav" aria-label="Month"></select>
                  <select id="workoutDayNav" class="we-nav" aria-label="Day"></select>
                  <button type="button" id="addPastExerciseBtn" class="exo-btn">Add exercise</button>
                  <span class="exo-toolbar-spacer"></span>
                  <button type="button" id="saveChangesBtn" class="exo-btn exo-btn-primary">Save changes</button>
                  <button type="button" id="deleteWorkoutBtn" class="exo-btn exo-btn-danger">Delete workout</button>
                </div>
                <form id="editForm"></form>
                <div id="fields"></div>
            </div>
        </div>
        <div style="margin-top: 10px;" class="hidden" id="exerciseeditor" >
              <!-- Optionally, add a selector for the type if needed -->


              <!-- Your exercise management section -->
              <div id="exoeditorsection">
              <div>
                <div class="mb-2">
                  <select style="margin-top: 10px;" id="typeSelector" hidden>
                    <option value="exercises">Exercises</option>
                    <option value="focusareas">Focus Areas</option>
                  </select>
  
                  <!-- Category → Exercise → Variation -->
                  <div id="exerciseHierarchyRow" class="exo-card exo-hierarchy">
                    <div class="exo-step"><span class="exo-step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
                      <div class="exo-step-body">
                        <label for="categorySelector">Category</label>
                        <select id="categorySelector" aria-label="Category"></select>
                      </div>
                    </div>
                    <span class="exo-arrow" aria-hidden="true">›</span>
                    <div class="exo-step"><span class="exo-step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 9v6M5 6v12M19 6v12M22 9v6M5 12h14"/></svg></span>
                      <div class="exo-step-body">
                        <label for="exerciseSelector">Exercise</label>
                        <select id="exerciseSelector" aria-label="Exercise"></select>
                      </div>
                    </div>
                    <span class="exo-arrow" aria-hidden="true">›</span>
                    <div class="exo-step"><span class="exo-step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></svg></span>
                      <div class="exo-step-body">
                        <label for="variationSelector">Variation</label>
                        <select id="variationSelector" aria-label="Variation">
                          <option value="">Default (no variation)</option>
                        </select>
                        <div class="exo-step-actions">
                          <button type="button" id="addExerciseVariationBtn" class="exo-btn exo-btn-sm">Add variation</button>
                          <button type="button" id="removeExerciseVariationBtn" class="exo-btn exo-btn-sm exo-btn-danger" disabled>Remove</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                </div>
                <div id="exercisenotessection" style="margin-top: 10px;"></div>
                <div class="exo-columns">
                  <section id="exerciseeditorsection" class="exo-card"></section>
                  <section id="volumeTrackingSection" class="exo-card"></section>
                </div>
                <div class="exo-card exo-footer">
                  <span id="exerciseCounter">Exercise 0 of 0</span>
                  <span>
                    <button type="button" id="prevExerciseBtn" class="btn btn-sm btn-outline-secondary" aria-label="Previous exercise">‹</button>
                    <button type="button" id="nextExerciseBtn" class="btn btn-sm btn-outline-secondary" aria-label="Next exercise">›</button>
                  </span>
                </div>
              </div></div>

          </div>
      </div>

</div>
  <hr>
  </section>

  <div class="row p-3 hidden" id="chartsSection">
    <div class="col-5" id="showchart">
      <button style="min-width: 150px;" id="showchartbtn" class="click">Show chart</button>
      <select id="filter-type" onchange="generatevisuals()">
        <option value="all">All Days</option>
      </select>
      
      
    </div>
    <div id="visuals-container"></div>
    <div class="col-12"><hr></div>
  </div>



  <section class="row p-3" id="showWorkoutsSection">
    <div class="col-12 period-bar" id="showworkouts">
      <button style="min-width: 150px;" class="click">Show workouts</button>
      <select id="workout-year-filter" class="period-select" aria-label="Year" style="display: none;">
        <option value="all">All years</option>
      </select>
      <select id="workout-month-filter" class="period-select" aria-label="Month" style="display: none;"></select>
    </div>
    <!-- Saved Workouts Section -->
    <div class="row p-3 hidden" id="savedWorkoutList">
      <!-- Saved workouts will appear here -->
    </div>
    <div class="col-12"><hr></div>
  </section>

  <!-- JavaScript -->
  <script src="js/api-database.js" defer></script>
  <script src="js/cognito-session.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/analytics.js" defer></script>
  <script src="js/progress.js" defer></script>
  <script src="js/volume.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <div class="row p-3" id="calendarSection">
    <div class="col-12 period-bar" id="showcal">
      <button style="min-width: 150px;" class="click">Show calendar</button>
      <select id="calendar-year-filter" class="period-select" aria-label="Year" style="display: none;">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
      </select>
    </div>
    
    <div id="calendar-container" style="padding-top: 20px; display: none;"></div>
    <div class="col-12"><hr></div>
  </div>

  

  <div class="row p-3" id="progressdiv">
    <div class="col-12">
      <button style="min-width: 150px;" id="toggleprogressBtn">Show progress</button>
      <div id="progressarea" class="hidden">
        <section id="Progress section" style="margin-top: 10px;">
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
            <button type="button" id="progressViewE1RM" class="btn btn-sm btn-outline-primary progress-view-btn active" data-view="e1RM">Estimated one-rep-max</button>
            <button type="button" id="progressViewAvgVolume" class="btn btn-sm btn-outline-primary progress-view-btn" data-view="avg3Volume" hidden>Average 3-set volume</button>
            <button type="button" id="progressViewBestEfforts" class="btn btn-sm btn-outline-primary progress-view-btn" data-view="bestEfforts">Best efforts</button>
          </div>

          <div id="e1rmControls" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
            <select id="ORMexerciseInput" style="width: 180px;" class="form-control form-control-sm"></select>
            <input type="number" id="ORMrepsInput" placeholder="Reps (3-8)" class="form-control form-control-sm" style="width:110px;" />
            <input type="number" id="ORMweightInput" placeholder="Weight (kg)" class="form-control form-control-sm" style="width:110px;" />
            <button type="button" id="recordE1RMBtn" class="btn btn-sm btn-outline-success">Record max effort set</button>
            <select id="ORMexerciseDataFilter" style="width: 180px;" class="form-control form-control-sm">
              <option value="all">All exercises</option>
            </select>
            <button type="button" id="showDataButton" class="btn btn-sm btn-outline-secondary">Show Data</button>
          </div>

          <div id="progressTableWrapper" style="overflow-x:auto; margin-bottom:12px;">
            <table id="progressTable" class="table table-sm table-bordered" style="min-width:760px; table-layout:fixed;">
              <thead id="progressTableHead"></thead>
              <tbody id="progressTableBody"></tbody>
            </table>
          </div>

          <ul id="performanceList" class="hidden" style="padding-left:20px; margin-top:10px;"></ul>
        </section>
      </div>
      <hr>
    </div>
  </div>






  <style>
    /* Add styles for the toggle and fields */
    .sr-fields {
      display: none;
      margin-top: 10px;
    }
    .sr-fields input {
      margin: 5px 0;
    }
    .hidden {
      display: none;
    }
    /* Workout draft grid styles */
    
#exerciseList {
    width: 100%;
}

.exercise-item {
    width: 100%;
    margin-bottom: 0.5rem;
    overflow: visible;
}

.exercise-row {
    display: grid;
    grid-template-columns: 200px var(--sets-w, 500px) 210px 200px 48px;
    gap: 0.75rem;
    width: max-content;
    min-width: 0;
    align-items: center;
    white-space: nowrap;
}

.exercise-name-col {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sets-col {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
}

.volume-col {
    min-width: 210px;
}

.note-col {
    min-width: 200px;
}

.remove-col {
    min-width: 72px;
}

.sets-container {
    width: 100%;
}

.single-set-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: nowrap;
}

.single-set-row .set-input {
    width: 72px;
    min-width: 72px;
}

.single-set-row .set-counter {
    min-width: 48px;
    text-align: center;
}

.note-col .form-control {
    width: 100%;
    min-width: 160px;
}


/* Allow the actual page to be wider than the viewport */
html {
  scrollbar-gutter: stable;
}

@supports not (scrollbar-gutter: stable) {
  html {
    overflow-y: scroll;
  }
}

html,
body {
    overflow-x: auto;
}

  </style>

<script data-goatcounter="https://workouts.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>




  <div class="row p-3" id="showvolume">
    <div class="col-12">
      <button style="min-width: 150px;" id="toggleVolumeBtn">Show Volume</button>
      <div id="volumearea" class="hidden" style="margin-top: 10px;">
        <section id="Volume section" style="margin-top: 10px;">
          <div class="volume-header" style="display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
            <button id="volumePrevMonth" class="btn btn-sm btn-outline-secondary">←</button>
            <span id="volumeMonthLabel" style="font-weight:600; font-size:1rem;"></span>
            <button id="volumeNextMonth" class="btn btn-sm btn-outline-secondary">→</button>
          </div>

          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
            <button type="button" class="btn btn-sm btn-outline-primary volume-view-btn active" data-view="sofar" hidden>So Far</button>
            <button type="button" class="btn btn-sm btn-outline-primary volume-view-btn" data-view="monthly">Monthly</button>
            <button type="button" class="btn btn-sm btn-outline-primary volume-view-btn" data-view="coverage">Cov. by month</button>
          </div>

          <div style="margin-bottom: 12px;">
            <div id="muscleMatrixArea" class="hidden" style="margin-top: 8px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
                <button type="button" id="addMuscleGroupBtn" class="btn btn-sm btn-outline-secondary">Add muscle group</button>
                <button type="button" id="removeMuscleGroupBtn" class="btn btn-sm btn-outline-secondary">Remove muscle group</button>
                <button type="button" id="addExerciseRowBtn" class="btn btn-sm btn-outline-secondary">Add exercise</button>

              <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;">
